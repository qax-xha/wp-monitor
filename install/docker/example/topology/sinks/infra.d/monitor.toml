version = "2.0"

[sink_group]
name = "monitor"
batch_timeout_ms = 300

[[sink_group.sinks]]
name = "metrics_vmetrics_sink"
connect = "victoriametrics_sink"
[sink_group.sinks.params]
endpoint = "http://localhost:18429"
api_path = "/api/v1/import/prometheus"

